name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    # Playwright 1.60 has no browser builds for Ubuntu 26.04 (today's ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Visual baselines are captured on macOS, so CI runs the end-to-end checks only.
      - run: npm run test:e2e

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -R index.html 404.html .nojekyll robots.txt sitemap.xml CNAME assets en Portfolio _site/
      # Temporary pages live on their own orphan branch (not in main's history) and are
      # published under a path of the same name while the branch exists.
      - name: Add temporary pages from their branches
        run: |
          for page in regal-tixer; do
            status=0
            git ls-remote --exit-code --heads origin "$page" > /dev/null || status=$?
            if [ "$status" -eq 2 ]; then
              continue
            elif [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            git fetch --depth=1 origin "$page"
            mkdir "_site/$page"
            git archive FETCH_HEAD | tar -x -C "_site/$page"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
